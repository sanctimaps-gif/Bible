name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Version serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        # Aucun accès réseau n'est requis : AELF, sanctimaps et l'API Anthropic
        # sont tous simulés.
        run: pytest

  navigateur:
    name: Page GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Parcours de la page principale
        # Chargée dans un vrai navigateur, avec un corpus de démonstration.
        # Rien ne sort du site : le test le vérifie explicitement.
        run: npm run test:statique

      - name: Parcours de la page assistant
        # L'API Anthropic est simulée ; aucune clé n'est nécessaire.
        run: npm run test:ia
